<!-- @let weatherDataT = weatherData(); -->
<div class="dashboard">
  @if (weatherData(); as data) {
    <div class="sticky-top">
      <h2 class="city-title">
        {{ data.location.name }}, {{ data.location.country }}
        @if (data.stale) {
          <span class="stale-badge">The data is outdated</span>
        }
      </h2>
      @if (displayCurrentWeather(); as current) {
        <isf-current-weather [current]="current">
          <isf-search-bar (search)="onSearch($event)"></isf-search-bar>
          <button mat-flat-button color="primary" class="chart-btn" (click)="goToHourlyChart()">
            View 24-Hour Chart
          </button>
        </isf-current-weather>
      }
    </div>

    <div class="scrollable-content">
      <div class="forecast-section">
        <h3>7-day forecast</h3>
        <isf-daily-forecast
          [daily]="data.payload.daily"
          (selectedDayChange)="onDaySelected($event)"
        >
        </isf-daily-forecast>
      </div>
      @if (activeDay(); as day) {
        <isf-weather-details [daily]="day" [hourly]="data.payload.hourly"> </isf-weather-details>
      }
    </div>
  }
</div>
