name: Client CI

on:
  push:
    branches: ['develop', 'main']
    paths:
      - 'client/**'
  pull_request:
    branches: ['develop', 'main']
    paths:
      - 'client/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
